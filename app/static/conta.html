<!DOCTYPE html>
<html lang="{{ i18n.lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{ i18n.account_page_title }} — {{ i18n.brand }}</title>
  <link rel="icon" type="image/png" href="{{ i18n.icon }}" />
  <link rel="apple-touch-icon" href="{{ i18n.icon }}" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/style.css?v={{ css_version }}" />
  {% if ga_measurement_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ ga_measurement_id }}');
  </script>
  {% endif %}
  <script>window.I18N = {{ i18n | tojson }};</script>
</head>
<body x-data="accountApp()" x-init="init()">

  <!-- Header -->
  <header class="conta-header">
    <a href="/" class="conta-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      {{ i18n.account_back }}
    </a>
    <a href="/" class="conta-logo">
      <img src="{{ i18n.logo }}" width="24" height="24" alt="{{ i18n.brand }}" />
      <span>{{ i18n.brand }}</span>
    </a>
  </header>

  <main class="conta-page">

    <!-- Loading -->
    <div class="conta-loading" x-show="loading">
      <div class="conta-spinner"></div>
      <p>{{ i18n.account_loading }}</p>
    </div>

    <template x-if="!loading">
      <div>

        <!-- Perfil -->
        <div class="conta-card">
          <div class="conta-card-header">
            <div class="conta-avatar" x-text="(user?.name || user?.email || '?')[0].toUpperCase()"></div>
            <div class="conta-user-info">
              <div class="conta-user-name" x-text="user?.name || user?.email"></div>
              <div class="conta-user-email" x-show="user?.name" x-text="user?.email"></div>
            </div>
            <div class="conta-badge"
                 :class="user?.is_exclusive ? 'conta-badge-exclusive' : user?.is_pro ? 'conta-badge-pro' : 'conta-badge-free'"
                 x-text="user?.is_exclusive ? 'Exclusive' : user?.is_pro ? 'Pro' : 'Free'"></div>
          </div>
        </div>

        <!-- Assinatura -->
        <div class="conta-card" x-show="user?.is_pro || subscription || proExpiresAt">
          <h2 class="conta-section-title">{{ i18n.account_subscription_title }}</h2>

          <!-- Ativa -->
          <template x-if="subscription && subscription.status === 'ACTIVE'">
            <div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">Status</span>
                <span class="conta-sub-value">
                  <span class="payment-status payment-status-received">{{ i18n.account_status_active }}</span>
                  <span class="pill-auto-renew" x-text="window.I18N.account_renews_pill + ' ' + formatShortDate(subscription.nextDueDate)"></span>
                  <span class="pill-exclusive" x-show="user?.is_exclusive" x-text="window.I18N.account_exclusive_until_pill + ' ' + formatShortDate(user.exclusive_until)"></span>
                </span>
              </div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">{{ i18n.account_plan_label }}</span>
                <span class="conta-sub-value" x-text="subscription.currency === 'USD' ? 'Pro — $' + subscription.value?.toFixed(2) + '/mo' : 'Pro — R$ ' + subscription.value?.toFixed(2).replace('.',',') + '/mês'"></span>
              </div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">{{ i18n.account_next_due }}</span>
                <span class="conta-sub-value" x-text="formatDate(subscription.nextDueDate)"></span>
              </div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">{{ i18n.account_payment_method }}</span>
                <span class="conta-sub-value" x-text="formatBillingType(subscription.billingType)"></span>
              </div>
              <button class="conta-btn-cancel" @click="cancelConfirmOpen = true">
                {{ i18n.account_cancel_plan_btn }}
              </button>
            </div>
          </template>

          <!-- Cancelado com período restante -->
          <template x-if="!subscription && proExpiresAt">
            <div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">Status</span>
                <span class="conta-sub-value">
                  <span class="payment-status payment-status-pending">{{ i18n.account_status_cancelled }}</span>
                </span>
              </div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">{{ i18n.account_pro_until }}</span>
                <span class="conta-sub-value" x-text="formatDate(proExpiresAt)"></span>
              </div>
              <button class="conta-btn-reactivate" @click="window.location.href='/?upgrade=1'">
                {{ i18n.account_reactivate_btn }}
              </button>
            </div>
          </template>

          <!-- Pro sem subscription visível (webhook ativou) -->
          <template x-if="user?.is_pro && !subscription && !proExpiresAt">
            <div>
              <div class="conta-sub-row">
                <span class="conta-sub-label">Status</span>
                <span class="conta-sub-value"><span class="payment-status payment-status-received">{{ i18n.account_status_active }}</span></span>
              </div>
              <p class="conta-sub-hint">{{ i18n.account_managed_externally }}</p>
            </div>
          </template>
        </div>

        <!-- Sem plano -->
        <div class="conta-card conta-card-upgrade" x-show="!user?.is_pro && !proExpiresAt">
          <p class="conta-upgrade-text">{{ i18n.account_free_plan_msg }}</p>
          <a href="/" class="conta-btn-upgrade">{{ i18n.account_see_pro_btn }}</a>
        </div>

        <!-- Histórico de pagamentos -->
        <div class="conta-card" x-show="payments.length > 0">
          <h2 class="conta-section-title">{{ i18n.account_payment_history_title }}</h2>
          <div class="payment-list">
            <template x-for="p in payments" :key="p.id">
              <div class="payment-row">
                <div class="payment-row-left">
                  <span class="payment-date" x-text="formatDate(p.paymentDate || p.dueDate)"></span>
                  <span class="payment-type" x-text="formatBillingType(p.billingType)"></span>
                </div>
                <div class="payment-row-right">
                  <span class="payment-value" x-text="'R$ ' + p.value?.toFixed(2).replace('.',',')"></span>
                  <span class="payment-status"
                        :class="{
                          'payment-status-received': p.status === 'RECEIVED',
                          'payment-status-pending':  ['PENDING','AWAITING_RISK_ANALYSIS'].includes(p.status),
                          'payment-status-refunded': ['REFUNDED','CHARGEBACK_REQUESTED','OVERDUE'].includes(p.status),
                        }"
                        x-text="formatStatus(p.status)"></span>
                  <a x-show="p.transactionReceiptUrl || p.invoiceUrl"
                     :href="p.transactionReceiptUrl || p.invoiceUrl"
                     target="_blank" rel="noopener"
                     class="payment-receipt">{{ i18n.account_receipt_link }}</a>
                </div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </template>

  </main>

  <!-- Modal: confirmar cancelamento -->
  <div class="modal-overlay" x-show="cancelConfirmOpen" x-transition @click.self="cancelConfirmOpen = false">
    <div class="modal-card modal-card-sm">
      <div class="clear-confirm-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <h2 class="clear-confirm-title">{{ i18n.account_cancel_modal_title }}</h2>
      <p class="clear-confirm-sub" x-text="window.I18N.account_cancel_modal_body.replace('{date}', formatDate(subscription?.nextDueDate))"></p>
      <div class="clear-confirm-actions">
        <button class="btn-clear-confirm" @click="cancelSubscription()" :disabled="cancelLoading">
          <span x-show="!cancelLoading">{{ i18n.account_cancel_confirm_btn }}</span>
          <span x-show="cancelLoading">{{ i18n.account_cancelling_btn }}</span>
        </button>
        <button class="btn-clear-cancel" @click="cancelConfirmOpen = false">{{ i18n.account_keep_plan_btn }}</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
  function accountApp() {
    return {
      loading:           true,
      user:              null,
      subscription:      null,
      payments:          [],
      proExpiresAt:      null,
      cancelConfirmOpen: false,
      cancelLoading:     false,
      _token:            null,
      error:             '',

      async init() {
        let s = {};
        try { s = JSON.parse(localStorage.getItem('routeSession') || '{}'); } catch (_) {}
        if (!s.token) { window.location.href = '/?login=1'; return; }
        this._token = s.token;
        try {
          const r = await fetch('/api/v1/billing/account', {
            headers: { Authorization: `Bearer ${s.token}` },
          });
          if (r.status === 401) { window.location.href = '/?login=1'; return; }
          const d = await r.json();
          this.user         = d.user;
          this.subscription = d.subscription;
          this.payments     = d.payments;
          // Update localStorage with fresh user data
          s.user = d.user;
          localStorage.setItem('routeSession', JSON.stringify(s));
        } catch (e) {
          this.error = window.I18N.account_error_load;
        } finally {
          this.loading = false;
        }
      },

      async cancelSubscription() {
        this.cancelLoading = true;
        try {
          const r = await fetch('/api/v1/billing/subscription', {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${this._token}` },
          });
          const d = await r.json();
          if (r.ok) {
            this.proExpiresAt = d.pro_expires_at;
            this.subscription = null;
            // Update localStorage
            const s = JSON.parse(localStorage.getItem('routeSession') || '{}');
            if (s.user) { s.user.is_pro = true; localStorage.setItem('routeSession', JSON.stringify(s)); }
          } else {
            this.error = d.detail || window.I18N.account_error_cancel;
          }
        } catch (e) {
          this.error = window.I18N.account_error_connection;
        } finally {
          this.cancelLoading   = false;
          this.cancelConfirmOpen = false;
        }
      },

      formatDate(iso) {
        if (!iso) return '—';
        const [y, m, d] = iso.slice(0, 10).split('-');
        return `${d}/${m}/${y}`;
      },

      formatShortDate(iso) {
        if (!iso) return '';
        const d = new Date(iso.slice(0, 10) + 'T00:00:00');
        return d.toLocaleDateString(window.I18N.locale, { day: 'numeric', month: 'short' });
      },

      formatBillingType(type) {
        return {
          PIX:         window.I18N.account_billing_pix,
          CREDIT_CARD: window.I18N.account_billing_card,
          BOLETO:      window.I18N.account_billing_boleto,
          STRIPE:      window.I18N.account_billing_stripe,
        }[type] || type || '—';
      },

      formatStatus(status) {
        return {
          RECEIVED:               window.I18N.status_paid,
          CONFIRMED:              window.I18N.status_confirmed,
          PENDING:                window.I18N.status_pending,
          AWAITING_RISK_ANALYSIS: window.I18N.status_under_review,
          OVERDUE:                window.I18N.status_overdue,
          REFUNDED:               window.I18N.status_refunded,
          CHARGEBACK_REQUESTED:   window.I18N.status_disputed,
        }[status] || status || '—';
      },
    };
  }
  </script>
</body>
</html>
